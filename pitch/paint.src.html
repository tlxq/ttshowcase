html, body { background: var(--look-ground); color: var(--look-text); }

.tag, .mail, .pick .top, .pick .bar, .pick .menu, .adm { background: var(--look-plate); border: 1px solid var(--look-plate-edge); border-radius: 3px; color: var(--look-text); font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: var(--look-label); }

.tag.wrap { white-space: normal; width: min(300px, 70vw); }

.tag b { display: block; font-weight: 500; color: var(--look-spray); }

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>

<script>
(() => {
  // The opening: a real concrete wall at night, one street light grazing it, and Tom's line poured down the wall
  // as the light comes on. (The hand-written tag code stays but is off: no pen samples.)
  const HAND = __HAND__;
  const NARROW = innerWidth / innerHeight < .8;
  const PROT = []; // what a plate must never cover: [name, one corner, the other corner (in the wall's own space), which plates ("" = all)]; the plates check reads them
  const canvas = document.getElementById("c");
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" }); }
  catch (e) { document.body.insertAdjacentHTML("beforeend", '<div class="nogl">This page needs WebGL.</div>'); return; }
  THREE.ColorManagement.legacyMode = false;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
  // loading progress for the bucket: every texture goes through the default manager
  let loadFrac = 0; THREE.DefaultLoadingManager.onProgress = (u, a, b) => { loadFrac = a / b; };
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x07080a); scene.fog = new THREE.FogExp2(0x0d0f13, .04);
  const camera = new THREE.PerspectiveCamera(NARROW ? 46 : 34, 1, .1, 120);
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const sm = t => t * t * (3 - 2 * t), cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

  // night light from a real rooftop (Poly Haven, CC0), only for reflections
  const pmrem = new THREE.PMREMGenerator(renderer);
  new THREE.TextureLoader().load("assets/env.jpg", t => { t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding; scene.environment = pmrem.fromEquirectangular(t).texture; t.dispose(); });

  // the wall: scanned concrete (Poly Haven concrete_wall_003, CC0)
  const tl = new THREE.TextureLoader(), maxAniso = renderer.capabilities.getMaxAnisotropy();
  // each picture is loaded and sent to the graphics card once; every surface that uses it shares it (own repeat/offset only)
  const texCache = {};
  const tex = (u, srgb, rx, ry, ox = 0, oy = 0) => { let c = texCache[u];
    if (!c) { c = texCache[u] = { all: [] }; c.base = tl.load(u, () => { c.all.forEach(t => t.needsUpdate = true); renderer.initTexture(c.base); }); }
    const t = c.all.length ? c.base.clone() : c.base; c.all.push(t); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.offset.set(ox, oy); t.anisotropy = maxAniso; if (srgb) t.encoding = THREE.sRGBEncoding; return t; };
  const WW = 90, WX = 24, WH = 10, GROUND = -2.2, TILE = 6;
  // downhill (Tom 11-16: scrolling down should go down): the street steps down 1.8 m twice, between the scenes
  const DROP = 1.8, G2 = GROUND - DROP, G3 = GROUND - 2 * DROP, STAIRS = [[5, 8, GROUND, G2], [19.3, 22.3, G2, G3]], NSTEP = 12;
  // the workshop (storyboard 5; Tom 11-17: you go in like a "brunn", a manhole). A room under the street from HX0 to CX1; a round cover on the
  // pavement by the wall at MX_IN slides aside, a ladder goes down a shaft into it; at MX_OUT a second shaft climbs out. MR: the shaft's radius,
  // MZ: its centre from the wall. DY: the room's ceiling (the ground above is 1.5 m deep), WF: its floor. The street stays at G3 from here on.
  const SV_END = 1180; document.documentElement.dataset.svEnd = SV_END; // the scroll at the page's end, in vh; the checks read it
  // the walk is a loop (Tom 11-17): after the pour the page parks UP vh down; scrolling up from there turns the camera left to the visitor wall.
  // upPx: the park in pixels, from the track's own height (a phone's vh and innerHeight differ while its address bar moves)
  const UP = 40, track = document.querySelector(".track"), upPx = () => track.offsetHeight * UP / (UP + SV_END + 100);
  let up0 = 0; // the park at the last frame
  window.svY = sv => upPx() + (document.documentElement.scrollHeight - innerHeight - upPx()) * sv / SV_END; // the checks scroll with this
  const HX0 = 35, CX1 = 66, MX_IN = 36.8, MX_OUT = 64, MZ = 1.1, MR = .42, RZ = 9, DY = G3 - 1.5, WF = G3 - 4.5, END_X = 104;
  const wallGeo = new THREE.PlaneGeometry(WW, WH + 2 * TILE); wallGeo.setAttribute("uv2", wallGeo.attributes.uv);
  const wall = new THREE.Mesh(wallGeo, new THREE.MeshStandardMaterial({ map: tex("assets/wall4_diff.jpg", true, WW / TILE, (WH + 2 * TILE) / TILE), normalMap: tex("assets/wall4_nor_gl.jpg", false, WW / TILE, (WH + 2 * TILE) / TILE), roughnessMap: tex("assets/wall4_rough.jpg", false, WW / TILE, (WH + 2 * TILE) / TILE), aoMap: tex("assets/wall4_ao.jpg", false, WW / TILE, (WH + 2 * TILE) / TILE), color: 0xc9ccd0, envMapIntensity: .3, normalScale: new THREE.Vector2(.7, .7) }));
  wall.position.set(WX, GROUND - 2 * TILE + (WH + 2 * TILE) / 2, 0); wall.receiveShadow = true; scene.add(wall); // reaches down to the workshop floor
  // the hole for moment 3 (Tom 11-16: the wall falls apart and the preschool shows behind it). Its edge: r(a) below, the same in JS (holeR)
  const holeU = { uHC: { value: new THREE.Vector2(0, 0) }, uHR: { value: new THREE.Vector2(1, 1) }, uOpen: { value: 0 }, uCrack: { value: 0 } };
  wall.material.onBeforeCompile = sh => { Object.assign(sh.uniforms, holeU);
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vWP;").replace("#include <worldpos_vertex>", "#include <worldpos_vertex>\nvWP = (modelMatrix * vec4(transformed, 1.)).xyz;");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", `#include <common>
      varying vec3 vWP; uniform vec2 uHC, uHR; uniform float uOpen, uCrack;
      float hh(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float hn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f); return mix(mix(hh(i), hh(i + vec2(1, 0)), f.x), mix(hh(i + vec2(0, 1)), hh(i + vec2(1, 1)), f.x), f.y); }
      float holeD(vec2 p) { vec2 q = (p - uHC) / uHR; float a = atan(q.y, q.x);
