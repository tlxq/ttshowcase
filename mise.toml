# Repo kit (~/.1dot/kit): `mise run check` is what pre-push runs, `mise run format` what pre-commit runs.
[tools]
node = "26.7.0"
"npm:@playwright/cli" = "0.1.22"
"npm:vercel" = "58.4.4"
# tools/osv-gate needs it
"aqua:google/osv-scanner" = "2.7.1"

# `showcase` (bin/showcase) works anywhere inside the repo
[env]
_.path = ["{{config_root}}/bin"]

[tasks.install]
description = "Install the npm packages if they are missing"
hide = true
run = "[ -d node_modules ] || npm ci"

[tasks.build]
description = "Build the static site into out/"
depends = ["install"]
run = "npm run build"

[tasks.open]
description = "Build, serve on this PC and open it in the browser"
depends = ["build"]
run = "tools/serve.sh localhost --open"

[tasks.serve]
description = "Serve the build on this PC's Tailscale address (port from PORT, default 8123)"
depends = ["build"]
run = "tools/serve.sh tailscale"

[tasks.dev]
description = "Live editing: serve on this PC's Tailscale address, changes show within seconds (port from PORT, default 3000)"
depends = ["install"]
run = "tools/dev.sh"

[tasks.write]
description = "The writing page: Tom writes the site's words with the S Pen on the phone; each is saved into src/content/hand (port from PORT, default 3011)"
run = "tools/write/write.sh"

[tasks."tags:sql"]
description = "Run tools/tags/schema.sql (or a .sql file you name) against the live tag store; safe to run again"
run = "tools/tags/sql.sh"

[tasks.tags]
description = "Make the site's words as graffiti tags (tools/write/tag.mjs) into src/content/hand; name words to make only those, e.g. mise run tags Lab"
run = "node tools/write/tag.mjs"

[tasks.share]
description = "Make the share card (public/share.jpg) from the first screen of /look; run it when the first screen changes"
depends = ["build"]
run = "tools/share.sh"

[tasks.previews]
description = "Film the sites in src/content/recordings.json scrolling, for the Live part's screens (the walk fails once a film is 30 days old); name one site to film only that"
run = "tools/previews.sh"

[tasks.walk]
description = "Build, serve on localhost and walk the page in a headless browser; name one walk to run only that, e.g. mise run walk fill-phone"
depends = ["build"]
run = "tools/walk/run.sh"

[tasks.pictures]
description = "Pictures of every part of the page and the 404 at 1440x900 and 390x844, at rest. On master they become the baseline (in .cache, never in git); on a branch they are compared with it and a before/after page is written. Options after --: --baseline saves this run as the baseline, --compare-only writes the page again from the last run"
depends = ["build"]
run = "tools/pictures/run.sh"

[tasks."pitch:build"]
description = "Build the paint pitch (pitch/) into .cache/pitch; the fonts are fetched once into .cache/fonts"
depends = ["install"]
run = "node tools/pitch/build.mjs"

[tasks.pitch]
description = "Build the paint pitch and serve it on this PC's Tailscale address, so the other PC and the phone can open it (port from PORT, default 8124); --open also opens it here"
depends = ["pitch:build"]
run = "PORT=${PORT:-8124} SERVE_DIR=.cache/pitch SERVE_PAGE=paint.html SERVE_BUILD=pitch:build SERVE_TAGS=1 tools/serve.sh tailscale"

[tasks."pitch:check"]
description = "Build the paint pitch and walk it at 1440 x 900 and on a phone: the whole walk, the waits, paints once, reduced motion, text contrast; name one check to run only that, e.g. mise run pitch:check contrast-phone"
depends = ["pitch:build"]
run = "tools/pitch/run.sh"

[tasks.check]
description = "The whole check (GitHub runs it on every PR): typecheck, lint, unit tests, build, /next closed without its key, no high/critical holes in shipped packages. Skipped when it already passed on this commit; --force runs it anyway"
run = "tools/check.sh"

[tasks."check:steps"]
description = "The steps of the check, without the saved-pass skip"
hide = true
depends = ["install"]
run = ["npm run typecheck", "node --test '.claude/hooks/*.test.mjs' 'src/**/*.test.ts' 'tools/showcase/*.test.mjs'", "npm run lint", "npm run build", "tools/next-check.sh", "tools/header-check.sh", "tools/fn-check.sh", "tools/osv-gate"]

[tasks.next]
description = "Open the new site behind its secret link: live (default) or dev (this PC's Tailscale dev server); --print prints it for the phone; preview [PR#] prints a PR's preview link with a QR"
run = "tools/next.sh"

[tasks.release]
description = "Name what's live: tag + GitHub Release, notes from the PR titles since the last one (major|minor|patch|vX.Y.Z, --dry-run)"
run = "tools/release.sh"

[tasks.format]
description = "Format the files given (pre-commit passes the staged ones and restages them), or all"
depends = ["install"]
run = "bash -c 'npx prettier --write --ignore-unknown \"${@:-.}\"' --"

[tasks.deps]
description = "Outdated packages (runs locally instead of Dependabot)"
run = "npm outdated || true"

[tasks."tags:live"]
description = "One real tag round on a deployment: send, held spot, approve, on the wall, remove (Tom gets one test mail); default ttdevs.com, or name a preview address"
run = "tools/tags/live.sh"
