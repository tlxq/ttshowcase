<!doctype html>
<!-- The front's share card (Tom picked B 11-24): studio photo 1e-2 cut out on the warm dark, the name left, the role
     in the code voice. tools/share-front/make.sh fills __FONTS__ and __TOKENS__ from the build and the tokens, and
     photographs it at 1200 × 630. The px sizes are the card's own: it is a picture, never a page. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      __FONTS__ __TOKENS__ * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--look-dark);
        color: var(--look-paint-light);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: radial-gradient(
          ellipse 60% 80% at 72% 60%,
          var(--look-dark-soft),
          var(--look-dark) 70%
        );
      }
      .photo {
        position: absolute;
        right: 40px;
        bottom: -40px;
        height: 640px;
      }
      h1 {
        position: absolute;
        left: 64px;
        top: 150px;
        font: 900 112px/0.86 var(--front-name);
        font-stretch: 125%;
        text-transform: uppercase;
        letter-spacing: -0.01em;
      }
      .blue {
        color: var(--front-spray);
      }
      .mono {
        position: absolute;
        left: 68px;
        font: 400 22px/1.5 var(--front-code);
        letter-spacing: 0.02em;
      }
      .role {
        top: 400px;
        max-width: 520px;
      }
      .role b {
        font-weight: 700;
      }
      .addr {
        bottom: 52px;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="photo" src="tom.webp" alt="" />
      <h1>Tom<br /><span class="blue">Larsson</span></h1>
      <p class="mono role">
        <b class="blue">Product engineer.</b> TypeScript, React and C#/.NET, from data model to
        server.
      </p>
      <p class="mono addr">ttdevs.com</p>
    </div>
  </body>
</html>
