name: check

# Repo kit (~/.1dot/kit, copied by `dot kit` into public repos; change it there).
# The same `mise run check` the pre-push hook runs in private repos; public repos run it here once, on GitHub.
on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: mise run check
